<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ENIGMA ROOMS - 회원가입</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<main class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <a class="logo" href="/">ENIGMA ROOMS</a>
            <p>새 계정을 만드세요</p>
        </div>

        <div class="auth-body">
            <div class="form-group">
                <label class="form-label">이름</label>
                <input id="name-input" class="form-input" type="text" placeholder="이름을 입력하세요">
            </div>
            <div class="form-group">
                <label class="form-label">아이디</label>
                <input id="login-id-input" class="form-input" type="text" placeholder="아이디를 입력하세요">
            </div>
            <div class="form-group">
                <label class="form-label">비밀번호</label>
                <input id="password-input" class="form-input" type="password" placeholder="비밀번호를 입력하세요">
            </div>
            <p id="error-message" class="error-message hidden"></p>
            <button class="submit-button" type="button" onclick="join()">회원가입</button>
            <p class="auth-link">이미 계정이 있으신가요? <a href="/login-page">로그인</a></p>
        </div>
    </div>
</main>
<script th:src="@{/js/join.js}"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ENIGMA ROOMS - 로그인</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<main class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <a class="logo" href="/">ENIGMA ROOMS</a>
            <p>계속하려면 로그인하세요</p>
        </div>

        <div class="auth-body">
            <div class="form-group">
                <label class="form-label">아이디</label>
                <input id="login-id-input" class="form-input" type="text" placeholder="아이디를 입력하세요">
            </div>
            <div class="form-group">
                <label class="form-label">비밀번호</label>
                <input id="password-input" class="form-input" type="password" placeholder="비밀번호를 입력하세요">
            </div>
            <p id="error-message" class="error-message hidden"></p>
            <button class="submit-button" type="button" onclick="login()">로그인</button>
            <p class="auth-link">계정이 없으신가요? <a href="/join-page">회원가입</a></p>
        </div>
    </div>
</main>
<script th:src="@{/js/login.js}"></script>
</body>
</html>
